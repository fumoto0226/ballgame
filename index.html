<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Falling Ballz · 关卡</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Helvetica Neue", -apple-system, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    .wrap { width: min(100vw, 420px); padding: 32px 28px; text-align: center; }
    h1 { font-size: 14px; letter-spacing: 4px; color: #e6ebe8; margin: 0 0 28px; font-weight: 400; }
    .levels { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .levels a { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 36px; padding: 0 10px; border: 1px solid #e6ebe8; color: #e6ebe8; font-size: 13px; text-decoration: none; letter-spacing: 1px; border-radius: 4px; }
    .levels a:hover { background: #e6ebe8; color: #000; }
    .empty { color: #666; font-size: 12px; letter-spacing: 1px; margin-top: 10px; }
    .footer { margin-top: 36px; font-size: 11px; color: #666; letter-spacing: 1px; }
    .footer a { color: #999; text-decoration: none; border-bottom: 1px solid #333; padding-bottom: 1px; }
    .footer a:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>选择关卡</h1>
    <div id="level-list" class="levels"></div>
    <div id="level-empty" class="empty" hidden>还没有关卡 · 去编辑器创建一个</div>
    <div class="footer"><a href="editor.html">编辑器</a></div>
  </main>
  <script src="js/levels/005.js"></script>
  <script src="js/level-catalog.js"></script>
  <script>
    (() => {
      const saves = LevelCatalog.all();
      const names = Object.keys(saves).sort();
      const list = document.querySelector('#level-list');
      const empty = document.querySelector('#level-empty');
      if (!names.length) { empty.hidden = false; return; }
      for (const name of names) {
        const a = document.createElement('a');
        a.href = `play.html?level=${encodeURIComponent(name)}`;
        a.textContent = name;
        list.appendChild(a);
      }
    })();
  </script>
</body>
</html>
